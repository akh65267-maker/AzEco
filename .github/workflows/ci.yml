name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CI: "true"
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Restore is a separate step so a dependency failure is distinguishable
      # from a compile failure in the logs.
      - run: dotnet restore

      # Warnings are errors (Directory.Build.props). This step is the gate that
      # keeps that promise honest.
      - run: dotnet build --no-restore --configuration Release

      - run: dotnet test --no-build --configuration Release --logger trx --results-directory TestResults

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/

  infra:
    name: Bicep build & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # azure-cli is preinstalled on ubuntu-latest runners.
      - name: Install Bicep
        run: az bicep install

      - name: Build
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

      # Lint separately so a style regression is distinguishable from a compile break.
      - name: Lint
        run: az bicep lint --file infra/main.bicep

      # Parameter files can compile against a template they no longer match; this
      # catches a renamed or removed parameter, which `build` alone does not.
      - name: Build parameter files
        run: |
          for f in infra/parameters/*.bicepparam; do
            az bicep build-params --file "$f" --stdout > /dev/null
          done

      # NOTE: `az deployment sub what-if` is the REAL gate — it is the only step that
      # catches policy denials, quota limits, name collisions and unregistered resource
      # providers. It needs a subscription and a federated credential, so it is added
      # when one exists. Until then, "it compiles" is the only verified claim.

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # "Don't commit secrets" as a policy has a 100% eventual failure rate.
      # Enforce it mechanically instead.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
